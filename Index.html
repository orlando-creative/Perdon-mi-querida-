<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perdóname 🥺</title>
<style>
:root{--bg:#ffe4ec;--card:#fff;--text:#4a1530;--yes:#e91e63;--no:#9e8a94;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1c;--card:#3b1727;--text:#ffe4ec;--yes:#ff4f8b;--no:#7d6a74}}
:root[data-theme="dark"]{--bg:#2a0f1c;--card:#3b1727;--text:#ffe4ec;--yes:#ff4f8b;--no:#7d6a74}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{background:var(--card);border-radius:24px;padding:28px 22px;width:min(92vw,420px);text-align:center;box-shadow:0 10px 30px rgba(233,30,99,.25);position:relative;z-index:2}
.emoji{font-size:64px;line-height:1}
h1{font-size:1.35rem;margin:14px 0 22px;line-height:1.35}
.row{display:flex;align-items:center;justify-content:center;gap:14px;min-height:90px}
button{border:0;border-radius:999px;color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
#yes{background:var(--yes);font-size:calc(1.1rem * var(--ys,1));padding:.6em 1.4em;transition:all .25s}
#yes.full{position:fixed;inset:0;width:100%;height:100%;border-radius:0;font-size:2.2rem;z-index:10}
#no{background:var(--no);font-size:calc(1rem * var(--ns,1));padding:.6em 1.2em;transition:all .3s;z-index:3}
.heart{position:fixed;bottom:-40px;animation:up linear forwards;pointer-events:none;z-index:1}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#done{display:none}
</style>
</head>
<body>
<div class="card" id="ask">
  <div class="emoji" id="emoji">🥺</div>
  <h1 id="q">Mi querida, perdóname por favor... ¿me perdonas?</h1>
  <div class="row">
    <button id="yes">Sí 💖</button>
    <button id="no">No</button>
  </div>
</div>
<div class="card" id="done">
  <div class="emoji">🥰</div>
  <h1>¡Gracias, mi princesa!<br>Te prometo ser mejor cada día. Te amo muchísimo ❤️</h1>
</div>
<script>
const msgs=[
 ["🥺","Mi querida, perdóname por favor... ¿me perdonas?"],
 ["😢","Mi amada, sé que me equivoqué... ¿me perdonas?"],
 ["🥹","Mi amor, piénsalo bien... ¿me das otra oportunidad?"],
 ["💔","Mi princesa, prometo mejorar... ¿sí me perdonas?"],
 ["😭","Mi querida, no me hagas llorar... ¿me perdonas?"],
 ["🙏","Mi amada, te lo suplico... ¿me perdonas?"],
 ["🌹","Mi amor, te traeré flores... ¿me perdonas?"],
 ["👑","Mi princesa, eres lo más importante para mí... ¿me perdonas?"]
];
const noTxt=["No","¿Segura?","Piénsalo","Porfa","Mmm...","No 😢","¿De verdad?","Ay no..."];
let n=0,ns=1;
const $=id=>document.getElementById(id);
const yes=$("yes"),no=$("no");
function hearts(k){
  for(let i=0;i<k;i++){
    const h=document.createElement("div");
    h.className="heart";h.textContent=["❤️","💖","💕","💗"][i%4];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(18+Math.random()*28)+"px";
    h.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6500);
  }
}
no.addEventListener("click",()=>{
  n++;
  const m=msgs[n%msgs.length];
  $("emoji").textContent=m[0];$("q").textContent=m[1];
  no.textContent=noTxt[n%noTxt.length];
  // el Sí crece
  yes.style.setProperty("--ys",1+n*0.35);
  if(n>=8)yes.classList.add("full");
  // el No se encoge al azar (o no) y siempre cambia de lugar
  if(Math.random()<0.6)ns=Math.max(0.35,ns*0.8);
  no.style.setProperty("--ns",ns);
  no.style.position="fixed";
  const w=no.offsetWidth,h=no.offsetHeight;
  const x=Math.random()*(window.innerWidth-w);
  const y=Math.random()*(window.innerHeight-h);
  no.style.left=Math.max(0,x)+"px";
  no.style.top=Math.max(0,y)+"px";
});
yes.addEventListener("click",()=>{
  $("ask").style.display="none";
  yes.classList.remove("full");yes.style.display="none";no.style.display="none";
  $("done").style.display="block";
  hearts(40);
  setInterval(()=>hearts(6),1500);
});
</script>
</body>
</html>
